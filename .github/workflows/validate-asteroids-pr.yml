# Temporary validation workflow; never merge this file.
name: Validate Asteroids patch series

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: kernelsu
    steps:
      - name: Check out patch repository
        uses: actions/checkout@v6
        with:
          path: patches-repo
          persist-credentials: false

      - name: Check out pinned KernelSU
        uses: actions/checkout@v6
        with:
          repository: tiann/KernelSU
          ref: 932014ab5b2c9b74a3d11e2ec4d17dd10fc9442e
          path: kernelsu
          fetch-depth: 0
          persist-credentials: false

      - name: Apply baseline patch series
        run: |
          set -euo pipefail
          version=$((30000 + $(git rev-list --count HEAD)))
          test "$version" = 32601
          for patch in "$GITHUB_WORKSPACE/patches-repo/patches/$version/common"/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          for name in \
            0001-recreate-zygote-boundary.patch \
            0002-vector-toybox-unshare.patch \
            0003-refresh-manager-after-late-load.patch; do
            patch="$GITHUB_WORKSPACE/patches-repo/patches/$version/devices/asteroids/$name"
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Generate exact 0004 and 0005 from applied source
        run: python3 "$GITHUB_WORKSPACE/patches-repo/tools/ci/materialize_asteroids_recovery.py"

      - name: Set up Rust targets
        run: |
          rustup update stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29

      - name: Format and build patched ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          KSU_PACKAGE_NAME: org.witaqua.pwn.kernelsu
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          for triple in aarch64-linux-android x86_64-linux-android; do
            source .github/scripts/setup-rust-build.sh "$triple" 26
            cargo build --target "$triple" --release --manifest-path ./userspace/ksud/Cargo.toml
          done
