name: Validate Asteroids patch series

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: kernelsu
    steps:
      - name: Check out patch repository
        uses: actions/checkout@v6
        with:
          path: patches-repo
          persist-credentials: false

      - name: Check out pinned KernelSU
        uses: actions/checkout@v6
        with:
          repository: tiann/KernelSU
          ref: 932014ab5b2c9b74a3d11e2ec4d17dd10fc9442e
          path: kernelsu
          fetch-depth: 0
          persist-credentials: false

      - name: Apply common and Asteroids patches
        run: |
          set -euo pipefail
          version=$((30000 + $(git rev-list --count HEAD)))
          test "$version" = 32601
          for set_name in common devices/asteroids; do
            set_dir="$GITHUB_WORKSPACE/patches-repo/patches/$version/$set_name"
            test -d "$set_dir"
            for patch in "$set_dir"/*.patch; do
              echo "-- $set_name/$(basename "$patch")"
              git apply --check "$patch"
              git apply "$patch"
            done
          done
          git diff --check

      - name: Set up Rust targets
        run: |
          rustup update stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29

      - name: Format and build patched ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          KSU_PACKAGE_NAME: org.witaqua.pwn.kernelsu
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          for triple in aarch64-linux-android x86_64-linux-android; do
            source .github/scripts/setup-rust-build.sh "$triple" 26
            cargo build --target "$triple" --release --manifest-path ./userspace/ksud/Cargo.toml
          done
