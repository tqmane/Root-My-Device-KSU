name: Manager

# The KernelSU manager, built with the patches in this repository applied to
# ksud and signed with the configured Root My Device release key.
#
# Why it exists: the manager rewrites /data/adb/ksud with the copy bundled in
# its own APK the first time it runs. On a device rooted by Root-My-Device that
# silently reverts the patches in ksud -- measured on Quest 3, where opening the
# official manager undid the soft-reboot module-daemon reap and the next soft
# restart went back to leaving stale daemons behind. A manager whose bundled
# ksud is already the patched one is what makes the patch survive the manager.
#
# It is built here because the patches are here. Nothing is forked: upstream is
# checked out at the revision the patches were written against and they are
# applied to the working tree, the same way Root-My-Device-Payloads builds a
# module, so:
#
#   - `git apply --check` fails the build if the tree is not that revision;
#   - `git rev-list --count HEAD` is untouched, so the manager's versionCode is
#     the upstream one and matches the module Root-My-Device-Payloads builds.
#
# The bundled ksud carries no LKM. Root-My-Device loads the module with its own
# ksud. This manager is here to keep the daemon on the device patched, not to
# install KernelSU. Device patch sets that modify userspace are validation-only
# here; their consuming target must build the installable Manager from the same
# ordered series, exact LKM and accepted signer.
#
# Hand-started only, and it publishes only with the box ticked. Leaving the box
# alone is the check -- it builds the manager and runs every assertion on it
# without publishing anything, which is what to do after changing a common
# patch. Nothing runs it on a push: the APK a push produced was thrown away,
# and a patch that lands is followed by a release run anyway, so it was
# building the same thing twice.

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: KernelSU revision to build, and the one the patches must apply to
        required: true
        default: 932014ab5b2c9b74a3d11e2ec4d17dd10fc9442e
      variant:
        description: Patch variant to validate; only common produces an installable Manager here
        required: true
        type: choice
        options:
          - common
          - asteroids
          - oneplus-pad3
        default: common
      release:
        description: publish the common-only Manager release as well as its artifact
        type: boolean
        default: false

permissions:
  contents: read

# KernelSU picks its manager by the APK signing certificate. The workflow
# derives the certificate hash and DER size from ROOT_MY_DEVICE_KEYSTORE_B64 at
# build time instead of hard-coding a repository-specific signer. Consuming
# Root-My-Device builds must use the same key when compiling KSU_EXPECTED_HASH /
# KSU_EXPECTED_SIZE.
env:
  # What the manager is called on the device. KernelSU 32601 exposes the
  # manager package/name as build properties; the 32601 common rebrand patch
  # changes their defaults, while these explicit values keep CI and consuming
  # device builds on the same identity.
  MANAGER_PACKAGE: org.witaqua.pwn.kernelsu
  MANAGER_NAME: Root My Device KSU
  CERT_MAX_LENGTH: 1024

jobs:
  manager:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ksu_version: ${{ steps.patch_series.outputs.ksu_version }}
      patch_variant: ${{ steps.patch_series.outputs.patch_variant }}
    # Everything after the two checkouts happens in the KernelSU tree: its
    # gradle project, its repack script, its cargo workspace.
    defaults:
      run:
        working-directory: kernelsu
    steps:
      - name: Check out the patch sets
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: patches-repo
          persist-credentials: false

      - name: Check out KernelSU at the revision the patches were written against
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: tiann/KernelSU
          ref: ${{ inputs.ksu_ref || '932014ab5b2c9b74a3d11e2ec4d17dd10fc9442e' }}
          path: kernelsu
          fetch-depth: 0
          persist-credentials: false

      - name: Apply the selected patch sets
        id: patch_series
        env:
          REQUESTED_VARIANT: ${{ inputs.variant || 'common' }}
          PUBLISH_RELEASE: ${{ inputs.release || false }}
        run: |
          set -euo pipefail
          # The directory is derived from the checked-out tree, never named
          # here, so a revision with no set fails instead of taking one written
          # against another tree.
          version=$((30000 + $(git rev-list --count HEAD)))
          echo "KernelSU version: $version"
          echo "KSU_VERSION=$version" >> "$GITHUB_ENV"

          # Match consuming builds exactly. The allowlist prevents arbitrary
          # workflow input from becoming a filesystem path, artifact name or
          # environment-file entry, and prevents incompatible device sets from
          # being combined into a supposed universal daemon.
          case "$REQUESTED_VARIANT" in
            common)
              sets=(common)
              manager_build_allowed=true
              ;;
            asteroids)
              sets=(common devices/asteroids)
              manager_build_allowed=false
              ;;
            oneplus-pad3)
              sets=(common devices/oneplus-pad3)
              manager_build_allowed=false
              ;;
            *)
              echo "::error::unsupported Manager patch variant: $REQUESTED_VARIANT"
              exit 1
              ;;
          esac
          if [ "$PUBLISH_RELEASE" = true ] && [ "$manager_build_allowed" != true ]; then
            echo "::error::target-specific variants are validation-only in this workflow"
            echo "::error::build their Manager with the consuming target so signer and embedded LKM match"
            exit 1
          fi

          LC_ALL=C
          shopt -s nullglob
          : > "$GITHUB_WORKSPACE/applied-patches.txt"
          for set_name in "${sets[@]}"; do
            set_dir="$GITHUB_WORKSPACE/patches-repo/patches/$version/$set_name"
            test -d "$set_dir" || {
              echo "::error::no patch set at patches/$version/$set_name"; exit 1; }
            patches=("$set_dir"/*.patch)
            test ${#patches[@]} -gt 0 || {
              echo "::error::patches/$version/$set_name has no patches"; exit 1; }
            for p in "${patches[@]}"; do
              test -f "$p" && test ! -L "$p" || {
                echo "::error::patch is not a regular non-symlink file: $p"; exit 1; }
              echo "-- $set_name/$(basename "$p")"
              git apply --check "$p"
              git apply "$p"
              digest=$(sha256sum "$p" | awk '{print $1}')
              printf '%s  %s\n' "$digest" "$set_name/$(basename "$p")" \
                >> "$GITHUB_WORKSPACE/applied-patches.txt"
            done
          done
          git diff --check
          echo "KSU_PATCH_VARIANT=$REQUESTED_VARIANT" >> "$GITHUB_ENV"
          echo "MANAGER_BUILD_ALLOWED=$manager_build_allowed" >> "$GITHUB_ENV"
          echo "ksu_version=$version" >> "$GITHUB_OUTPUT"
          echo "patch_variant=$REQUESTED_VARIANT" >> "$GITHUB_OUTPUT"
          echo "Manager patch variant: $REQUESTED_VARIANT"

      - name: Set up Java
        if: env.MANAGER_BUILD_ALLOWED == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        if: env.MANAGER_BUILD_ALLOWED == 'true'

      - name: Set up the Android SDK
        if: env.MANAGER_BUILD_ALLOWED == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Set up build-tools
        if: env.MANAGER_BUILD_ALLOWED == 'true'
        run: |
          sdkmanager "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Set up Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: kernelsu/userspace/ksud

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with:
          ndk-version: r29

      - name: Build the patched ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          KSU_PACKAGE_NAME: ${{ env.MANAGER_PACKAGE }}
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          for triple in aarch64-linux-android x86_64-linux-android; do
            # shellcheck disable=SC1091
            source .github/scripts/setup-rust-build.sh "$triple" 26
            cargo build --target "$triple" --release \
              --manifest-path ./userspace/ksud/Cargo.toml
          done

      - name: Materialize and validate the signing key
        if: env.MANAGER_BUILD_ALLOWED == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ROOT_MY_DEVICE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ROOT_MY_DEVICE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROOT_MY_DEVICE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ROOT_MY_DEVICE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS; do
            [ -n "${!name:-}" ] || {
              echo "::error::missing Actions secret for $name"
              echo "::error::configure ROOT_MY_DEVICE_KEYSTORE_B64, ROOT_MY_DEVICE_STORE_PASSWORD and ROOT_MY_DEVICE_KEY_ALIAS in this repository"
              exit 1
            }
          done
          key_password=${KEY_PASSWORD:-$STORE_PASSWORD}

          printf '%s' "$KEYSTORE_B64" | base64 --decode > key.jks
          chmod 600 key.jks
          [ -s key.jks ] || { echo "::error::decoded keystore is empty"; exit 1; }

          # Validate the store/alias now and derive the exact certificate pair
          # KernelSU modules must be compiled to accept.
          keytool -list -keystore key.jks -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          keytool -exportcert -keystore key.jks -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" -file cert.der >/dev/null
          cert_sha=$(sha256sum cert.der | awk '{print $1}')
          cert_size=$(stat -c%s cert.der)
          [ "$cert_size" -le "$CERT_MAX_LENGTH" ] || {
            echo "::error::signing certificate is $cert_size bytes; KernelSU limit is $CERT_MAX_LENGTH"
            exit 1
          }
          echo "Manager signer: $cert_sha ($cert_size bytes DER)"
          echo "EXPECTED_CERT_SHA256=$cert_sha" >> "$GITHUB_ENV"
          echo "EXPECTED_CERT_SIZE=$cert_size" >> "$GITHUB_ENV"

          {
            echo "KEYSTORE_FILE=$PWD/key.jks"
            echo "KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$key_password"
          } >> manager/gradle.properties

      - name: Record the exact daemon variant
        run: |
          set -euo pipefail
          rmd_sha=$(git -C "$GITHUB_WORKSPACE/patches-repo" rev-parse HEAD)
          ksu_sha=$(git rev-parse HEAD)
          arm64_sha=$(sha256sum target/aarch64-linux-android/release/ksud | awk '{print $1}')
          x86_64_sha=$(sha256sum target/x86_64-linux-android/release/ksud | awk '{print $1}')
          if [ "$MANAGER_BUILD_ALLOWED" = true ]; then
            signer="$EXPECTED_CERT_SHA256"
          else
            signer=consuming-build-required
          fi
          {
            echo 'manifest_version=1'
            echo "rmd_sha=$rmd_sha"
            echo "ksu_sha=$ksu_sha"
            echo "ksu_version=$KSU_VERSION"
            echo "variant=$KSU_PATCH_VARIANT"
            echo "installable_manager=$MANAGER_BUILD_ALLOWED"
            echo "manager_package=$MANAGER_PACKAGE"
            echo "manager_certificate_sha256=$signer"
            if [ "$MANAGER_BUILD_ALLOWED" = true ]; then
              echo "manager_certificate_size=$EXPECTED_CERT_SIZE"
            fi
            echo "ksud_arm64_sha256=$arm64_sha"
            echo "ksud_x86_64_sha256=$x86_64_sha"
            sed 's/^/patch_sha256=/' "$GITHUB_WORKSPACE/applied-patches.txt"
          } > "$GITHUB_WORKSPACE/variant-manifest.txt"
          cat "$GITHUB_WORKSPACE/variant-manifest.txt"

      - name: Build the manager
        if: env.MANAGER_BUILD_ALLOWED == 'true'
        working-directory: kernelsu/manager
        run: |
          ./gradlew clean assembleRelease \
            -PKSU_PACKAGE_NAME="$MANAGER_PACKAGE" -PKSU_NAME="$MANAGER_NAME"

      # Gradle's APK carries no ksud; repack_apk.py is what puts one in, which
      # is also how upstream produces the APK it releases.
      - name: Repack with the patched ksud and re-sign
        if: env.MANAGER_BUILD_ALLOWED == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ROOT_MY_DEVICE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROOT_MY_DEVICE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ROOT_MY_DEVICE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key_password=${KEY_PASSWORD:-$STORE_PASSWORD}
          python3 repack_apk.py repack \
            -b release -t release \
            -a arm64-v8a -a x86_64 \
            -K key.jks -A "$KEY_ALIAS" -P "$STORE_PASSWORD" -S "$key_password" \
            -n "RootMyDeviceKSU_${KSU_VERSION}_${KSU_PATCH_VARIANT}"

      - name: Check the Manager bundles this run's exact daemons
        if: env.MANAGER_BUILD_ALLOWED == 'true'
        run: |
          set -euo pipefail
          apk=$(find dist -name '*.apk' -type f | head -n 1)
          test -n "$apk" || { echo "::error::repack produced no apk"; exit 1; }
          python3 - "$apk" <<'PY'
          import hashlib
          import pathlib
          import sys
          import zipfile

          apk = pathlib.Path(sys.argv[1])
          expected = {
              "arm64-v8a": pathlib.Path("target/aarch64-linux-android/release/ksud"),
              "x86_64": pathlib.Path("target/x86_64-linux-android/release/ksud"),
          }
          with zipfile.ZipFile(apk) as archive:
              for abi, source in expected.items():
                  entry = f"lib/{abi}/libksud.so"
                  bundled = archive.read(entry)
                  built = source.read_bytes()
                  if bundled != built:
                      raise SystemExit(
                          f"{entry} mismatch: bundled={hashlib.sha256(bundled).hexdigest()} "
                          f"built={hashlib.sha256(built).hexdigest()}"
                      )
                  print(f"{entry}: {hashlib.sha256(built).hexdigest()}")
          PY

      - name: Check the APK is the manager the modules look for
        if: env.MANAGER_BUILD_ALLOWED == 'true'
        run: |
          set -euo pipefail
          apk=$(find dist -name '*.apk' -type f | head -n 1)
          test -n "$apk" || { echo "::error::repack produced no apk"; exit 1; }
          badging=$(aapt2 dump badging "$apk")
          pkg=$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" <<<"$badging")
          label=$(sed -n "s/^application-label:'\\([^']*\\)'.*/\\1/p" <<<"$badging")
          echo "package: $pkg"
          echo "label:   $label"
          # The module is built with KSU_MANAGER_PACKAGE pinned to this, so an
          # APK under any other name is not a manager as far as the kernel is
          # concerned -- and the patch set that renames it differs by upstream
          # version, which is exactly the kind of thing to check rather than
          # assume.
          [ "$pkg" = "$MANAGER_PACKAGE" ] || {
            echo "::error::built as $pkg, but the modules only accept $MANAGER_PACKAGE"; exit 1; }
          [ "$label" = "$MANAGER_NAME" ] || {
            echo "::error::labelled '$label', expected '$MANAGER_NAME'"; exit 1; }

      - name: Check the APK is signed with the configured certificate
        if: env.MANAGER_BUILD_ALLOWED == 'true'
        run: |
          set -euo pipefail
          apk=$(find dist -name '*.apk' -type f | head -n 1)
          test -n "$apk" || { echo "::error::repack produced no apk"; exit 1; }
          echo "apk: $apk"

          certs=$(apksigner verify --print-certs "$apk" 2>&1) || {
            echo "$certs"; echo "::error::apksigner could not read $apk"; exit 1; }
          got=$(sed -n 's/.*certificate SHA-256 digest: *//p' <<<"$certs" | head -1)
          if [ -z "$got" ]; then
            echo "$certs"; echo "::error::apksigner printed no certificate digest"; exit 1
          fi
          [ "$got" = "$EXPECTED_CERT_SHA256" ] || {
            echo "::error::APK signer $got does not match configured key $EXPECTED_CERT_SHA256"
            exit 1
          }

          size=$(stat -c%s cert.der)
          echo "certificate: $got, $size bytes of DER"
          [ "$size" = "$EXPECTED_CERT_SIZE" ] || {
            echo "::error::certificate changed during build: $size != $EXPECTED_CERT_SIZE"; exit 1; }
          [ "$size" -le "$CERT_MAX_LENGTH" ] || {
            echo "::error::$size bytes is past KernelSU CERT_MAX_LENGTH ($CERT_MAX_LENGTH)"; exit 1; }

      - name: Verify the reap patch is in the bundled ksud
        run: |
          set -euo pipefail
          # Cheap proof that the APK really carries the patched daemon rather
          # than an upstream one: the string only this patch adds.
          for marker in 'leftover module daemon' 'late-load compatibility'; do
            if ! grep -qa "$marker" target/aarch64-linux-android/release/ksud; then
              echo "::error::the built ksud is missing patch marker: $marker"
              exit 1
            fi
          done
          echo "ksud carries the soft-reboot reaper and explicit late-load module compatibility"

      - name: Verify the selected target daemon variant
        if: env.MANAGER_BUILD_ALLOWED != 'true'
        run: |
          set -euo pipefail
          case "$KSU_PATCH_VARIANT" in
            asteroids)
              markers=(
                'Asteroids late-load: recreating zygote-start boundary'
                'Asteroids late-load: Vector root daemon socket registered'
                'Asteroids late-load: KernelSU Manager restarted after late-load'
              )
              ;;
            oneplus-pad3)
              markers=(
                'OnePlus Pad 3 late-load: replacement system_server verified before exact-once service stage'
                'OnePlus Pad 3 late-load: trusted root-private completion receipt committed after SELinux enforcing readback'
                'trusted staged-daemon path was not supplied by the late-load helper'
              )
              ;;
            *)
              echo "::error::unexpected validation-only variant: $KSU_PATCH_VARIANT"
              exit 1
              ;;
          esac
          for marker in "${markers[@]}"; do
            grep -qa "$marker" target/aarch64-linux-android/release/ksud || {
              echo "::error::$KSU_PATCH_VARIANT ksud is missing marker: $marker"
              exit 1
            }
          done
          echo "::notice::$KSU_PATCH_VARIANT source and ksud validation passed"
          echo "::notice::no Manager APK is produced here; the consuming target must embed its exact LKM and use its own accepted signer"

      - name: Upload the manager
        if: env.MANAGER_BUILD_ALLOWED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: manager-root-my-device-${{ env.KSU_VERSION }}-${{ env.KSU_PATCH_VARIANT }}
          path: |
            kernelsu/dist/*.apk
            variant-manifest.txt

      - name: Upload the target-variant validation manifest
        if: env.MANAGER_BUILD_ALLOWED != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validation-${{ env.KSU_VERSION }}-${{ env.KSU_PATCH_VARIANT }}
          path: variant-manifest.txt

  release:
    if: ${{ inputs.release && inputs.variant == 'common' }}
    needs: manager
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified common Manager
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: manager-root-my-device-${{ needs.manager.outputs.ksu_version }}-${{ needs.manager.outputs.patch_variant }}
          path: release-artifact

      - name: Publish the verified common Manager
        env:
          GH_TOKEN: ${{ github.token }}
          KSU_VERSION: ${{ needs.manager.outputs.ksu_version }}
          KSU_PATCH_VARIANT: ${{ needs.manager.outputs.patch_variant }}
        run: |
          set -euo pipefail
          [ "$KSU_PATCH_VARIANT" = common ] || {
            echo "::error::only the common Manager may be published by this workflow"; exit 1; }
          mapfile -t apks < <(find release-artifact -type f -name '*.apk' -print)
          mapfile -t manifests < <(find release-artifact -type f -name 'variant-manifest.txt' -print)
          [ "${#apks[@]}" -eq 1 ] && [ "${#manifests[@]}" -eq 1 ] || {
            echo "::error::release artifact must contain exactly one APK and one manifest"; exit 1; }
          apk=${apks[0]}
          manifest=${manifests[0]}
          test -f "$apk" && test ! -L "$apk" || {
            echo "::error::Manager artifact is not a regular non-symlink file"; exit 1; }
          test -f "$manifest" && test ! -L "$manifest" || {
            echo "::error::variant manifest is not a regular non-symlink file"; exit 1; }
          grep -Fxq "ksu_version=$KSU_VERSION" "$manifest"
          grep -Fxq 'variant=common' "$manifest"
          grep -Fxq 'installable_manager=true' "$manifest"
          grep -Fxq "rmd_sha=$GITHUB_SHA" "$manifest"

          tag="manager-${KSU_VERSION}-${KSU_PATCH_VARIANT}-${GITHUB_SHA::7}"
          cat > notes.md <<NOTES
          Upstream KernelSU $KSU_VERSION with this repository's \`common\`
          patch set applied to ksud, renamed to **$MANAGER_NAME**
          (\`$MANAGER_PACKAGE\`) and signed with the configured Root My Device release key.

          This APK is for common-compatible builds compiled to accept that
          package and certificate. Targets whose device patch set changes
          userspace must use the signer-matched Manager produced by their own
          consuming build; this common Manager is not interchangeable.
          NOTES
          sed -i 's/^          //' notes.md

          gh release create "$tag" "$apk" "$manifest" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Root My Device KSU manager $KSU_VERSION common" \
            --notes-file notes.md
